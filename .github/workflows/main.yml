name: Generate GitHub Metrics
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          user: Kirill9m
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "Update GitHub Metrics SVG"
          
          # 1. Глубокий обход коммитов во всех репозиториях
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 300
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          
          # Связывает коммиты по вашему логину и почте (если коммитили с локальным git config)
          config_order: base.header, isocalendar, languages, lines, followup
          
          # 2. Изометрический календарь со всеми активностями
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # 3. Детальный учет языков по коммитам (включая приватные)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 60
          
          # 4. Плагин Follow-up: отображает статус Issues и Pull Requests
          plugin_followup: yes
          plugin_followup_sections: overview, user
          plugin_followup_indepth: yes
          
          # 5. Строки кода
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 8
          plugin_lines_delay: 30
