name: Generate GitHub Metrics
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          user: Kirill9m
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "Update GitHub Metrics SVG"
          
          # Базовая сводка
          base: header, activity, community, repositories, metadata
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          
          config_order: base.header, isocalendar, followup, languages, habits
          
          # Календарь активности
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Все ваши Issues и PR (включая закрытые/приватные)
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_archived: yes
          
          # Языки (быстрый расчет без сканирования строк)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # Привычки кодинга (заменяет зависающие lines: показывает недавние коммиты и ритм работы)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # ВАЖНО: plugin_lines отключен, чтобы не вешать воркфлоу
          plugin_lines: no
