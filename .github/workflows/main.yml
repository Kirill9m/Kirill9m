name: Generate GitHub Metrics

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.26
        with:
          username: Kirill9m
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          count_private: true
