name: Generate GitHub Metrics
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          user: Kirill9m
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "Update GitHub Metrics SVG"
          
          # Базовая статистика без долгого клонирования
          base: header, activity, community, repositories, metadata
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          
          # Если коммитите с рабочей/другой почты — укажите её:
          # commits_authoring: Kirill9m, your-work-email@example.com
          
          config_order: base.header, isocalendar, followup, languages, lines
          
          # Календарь
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Issues и Pull Requests (легковесный поиск через API)
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          
          # Языки (без глубокого обхода git history каждого файла)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # Строки кода — строго ограничено, чтобы не висело 10+ минут
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
